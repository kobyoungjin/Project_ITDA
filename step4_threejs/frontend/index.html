<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>잇다(ITDA) - 3D 아바타 리타겟팅</title>
  <style>
    :root {
      --bg-deep: #050810;
      --bg-glass: rgba(15, 23, 42, 0.7);
      --accent-cyan: #00f2fe;
      --accent-purple: #7000ff;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-deep);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Background Animation */
    body::before {
      content: '';
      position: absolute; inset: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(112, 0, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(0, 242, 254, 0.1) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
    }

    header {
      padding: 1rem 2rem;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .logo { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.05em; display: flex; align-items: center; gap: 0.5rem; }
    .logo span { color: var(--accent-cyan); }
    .status-badge {
      background: rgba(0, 242, 254, 0.1);
      color: var(--accent-cyan);
      border: 1px solid rgba(0, 242, 254, 0.3);
      padding: 0.25rem 0.75rem;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #three-canvas {
      width: 100%; height: 100%;
      display: block;
    }

    /* PIP Video Container */
    #pip-container {
      position: absolute;
      top: 2rem; right: 2rem;
      width: 320px;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 12px;
      border: 2px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #pip-container:hover { transform: scale(1.02); border-color: var(--accent-cyan); }
    #pip-video { width: 100%; height: 100%; object-fit: cover; }
    .pip-label {
      position: absolute; top: 0.5rem; left: 0.5rem;
      background: rgba(0, 0, 0, 0.6);
      padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; color: #fff;
    }

    /* Translation Panel */
    #translation-panel {
      position: absolute;
      bottom: 2rem; left: 50%;
      transform: translateX(-50%);
      width: 80%; max-width: 800px;
      background: var(--bg-glass);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .output-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; }
    
    .slm-output { color: var(--text-muted); font-size: 1rem; font-style: italic; }
    .rag-output { color: var(--text-main); font-size: 1.5rem; font-weight: 600; }
    .rag-output span { border-bottom: 2px solid var(--accent-cyan); }

    /* Controls Overlay */
    .controls {
      position: absolute;
      bottom: 2rem; right: 2rem;
      display: flex; flex-direction: column; gap: 0.75rem;
    }
    .btn-circle {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--bg-glass); border: 1px solid var(--border);
      color: white; font-size: 1.2rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(8px); transition: all 0.2s;
    }
    .btn-circle:hover { background: var(--accent-purple); border-color: transparent; transform: translateY(-2px); }

    /* HUD Overlay */
    .hud {
      position: absolute; top: 2rem; left: 2rem;
      display: flex; flex-direction: column; gap: 0.5rem; pointer-events: none;
    }
    .hud-item { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--accent-cyan); }
  </style>
</head>
<body>
  <header>
    <div class="logo">ITDA <span>SIGN</span></div>
    <div class="status-badge">Phase 4: Real-time Retargeting</div>
  </header>

  <main>
    <canvas id="three-canvas"></canvas>
    <div class="hud">
      <div class="hud-item" id="fps-display">FPS: --</div>
      <div class="hud-item" id="joint-status">Joints: READY</div>
    </div>

    <div id="pip-container">
      <div class="pip-label">교육 샘플 / PIP</div>
      <video id="pip-video" autoplay muted loop playsinline>
        <source src="https://vjs.zencdn.net/v/oceans.mp4" type="video/mp4">
      </video>
    </div>

    <div id="translation-panel">
      <div class="output-group">
        <div class="label">Local SLM Prediction (Phi-3)</div>
        <div class="slm-output" id="slm-output">...</div>
      </div>
      <div class="output-group">
        <div class="label">Server RAG Correction (Gemini)</div>
        <div class="rag-output" id="rag-output">Waiting for input...</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-circle" id="btn-camera-reset" title="카메라 시점 초기화">🎥</button>
      <button class="btn-circle" id="btn-avatar-reset" title="아바타 리셋">🔄</button>
    </div>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./js/avatar.js"></script>
</body>
</html>
