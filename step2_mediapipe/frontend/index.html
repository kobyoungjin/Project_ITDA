<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>잇다(ITDA) - 실시간 수어 인식</title>
  <meta name="description" content="MediaPipe 기반 실시간 수어 관절 좌표 추출 및 AI 번역 엔진 - 잇다 프로젝트 2단계" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <!-- MediaPipe Hands (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    /* ── 리셋 & 기본 ──────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:    #0A0F1E;
      --bg-card:    #111827;
      --bg-glass:   rgba(17, 24, 39, 0.7);
      --border:     rgba(255, 255, 255, 0.08);
      --accent:     #00FFB3;
      --accent2:    #7C3AED;
      --accent3:    #FF6B6B;
      --text-main:  #F1F5F9;
      --text-muted: #94A3B8;
      --shadow-lg:  0 25px 50px rgba(0, 0, 0, 0.5);
      --radius-lg:  16px;
      --radius-md:  10px;
    }

    html, body {
      height: 100%;
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg-deep);
      color: var(--text-main);
      overflow: hidden;
    }

    /* ── 배경 그라디언트 애니메이션 ───────────────────────── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 30%, rgba(0,255,179,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 80% 70%, rgba(124,58,237,0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── 레이아웃 ─────────────────────────────────────────── */
    .app {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      gap: 0;
    }

    /* ── 헤더 ─────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .logo-text { font-size: 1.1rem; font-weight: 700; }
    .logo-sub  { font-size: 0.75rem; color: var(--text-muted); margin-top: 1px; }

    .header-badges {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .badge-stage  { background: rgba(124,58,237,0.2); color: #A78BFA; border: 1px solid rgba(124,58,237,0.3); }
    .badge-ws     { background: rgba(0,255,179,0.1);  color: var(--accent); border: 1px solid rgba(0,255,179,0.2); }
    .badge-ws.disconnected { background: rgba(255,107,107,0.1); color: var(--accent3); border-color: rgba(255,107,107,0.2); }

    /* ── 메인 콘텐츠 ─────────────────────────────────────── */
    .main {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 0;
      overflow: hidden;
    }

    /* ── 비디오 뷰포트 ────────────────────────────────────── */
    .video-zone {
      position: relative;
      background: #000;
      overflow: hidden;
    }

    #input-video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* 거울 모드 */
    }

    #output-canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      transform: scaleX(-1); /* 비디오와 동일 방향 */
      pointer-events: none;
    }

    /* 카메라 미허용 상태 오버레이 */
    .cam-placeholder {
      position: absolute; inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #0A0F1E;
    }
    .cam-placeholder.hidden { display: none; }
    .cam-icon {
      width: 80px; height: 80px;
      border: 2px dashed var(--border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { border-color: var(--border); }
      50%       { border-color: var(--accent); }
    }
    .cam-placeholder p {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
    }

    /* 손 감지 안내 배너 */
    .no-hand-banner {
      position: absolute;
      bottom: 16px; left: 50%; transform: translateX(-50%);
      background: var(--bg-glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 0.8rem;
      color: var(--text-muted);
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .no-hand-banner.hidden { opacity: 0; }

    /* ── 사이드 패널 ──────────────────────────────────────── */
    .side-panel {
      background: var(--bg-card);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 20px;
      gap: 16px;
    }

    .panel-section {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
    }
    .section-title {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* ── 제어 버튼 ────────────────────────────────────────── */
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:active { transform: scale(0.97); }

    .btn-start {
      background: linear-gradient(135deg, var(--accent), #00CFA8);
      color: #0A0F1E;
    }
    .btn-start:hover { filter: brightness(1.1); box-shadow: 0 0 20px rgba(0,255,179,0.3); }
    .btn-start:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-stop {
      background: rgba(255,107,107,0.15);
      color: var(--accent3);
      border: 1px solid rgba(255,107,107,0.3);
    }
    .btn-stop:hover { background: rgba(255,107,107,0.25); }

    .btn-secondary {
      background: rgba(255,255,255,0.05);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.08); color: var(--text-main); }

    .btn-row { display: flex; gap: 8px; }
    .btn-row .btn { flex: 1; }

    /* ── 통계 패널 ────────────────────────────────────────── */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .stat-label { font-size: 0.68rem; color: var(--text-muted); margin-bottom: 4px; }
    .stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent);
    }
    .stat-value.warn { color: #FFD93D; }
    .stat-value.bad  { color: var(--accent3); }

    /* ── 좌표 로그 ────────────────────────────────────────── */
    .coord-log {
      background: #060A14;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: #64748B;
      height: 200px;
      overflow-y: auto;
      line-height: 1.6;
    }
    .coord-log .log-line { margin-bottom: 2px; }
    .coord-log .log-line .key  { color: var(--accent); }
    .coord-log .log-line .val  { color: #CBD5E1; }
    .coord-log .log-line .hand { color: #A78BFA; }
    .coord-log .empty { color: var(--text-muted); font-style: italic; }

    /* ── 세션 정보 ────────────────────────────────────────── */
    .session-info {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--text-muted);
      word-break: break-all;
    }
    .session-label { color: #64748B; margin-bottom: 4px; }

    /* ── 관절 인덱스 맵 ─────────────────────────────────── */
    .index-map {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }
    .index-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.68rem;
    }
    .idx-badge {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: rgba(0,255,179,0.15);
      border: 1px solid rgba(0,255,179,0.3);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .idx-name { color: var(--text-muted); font-size: 0.65rem; }

    /* ── 푸터 ─────────────────────────────────────────────── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 24px;
      background: var(--bg-glass);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    .footer-left { display: flex; align-items: center; gap: 16px; }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: blink 1.5s ease-in-out infinite;
    }
    .dot.off { background: #374151; animation: none; }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ── 스크롤바 ─────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── 반응형 (모바일 웹뷰) ──────────────────────────────  */
    @media (max-width: 700px) {
      .main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      .side-panel {
        border-left: none;
        border-top: 1px solid var(--border);
        max-height: 260px;
      }
      .stat-grid { grid-template-columns: repeat(4, 1fr); }
      .coord-log { height: 80px; }
      .index-map, .session-info { display: none; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- ── 헤더 ─────────────────────────────────────────────── -->
  <header class="header">
    <div class="logo">
      <div class="logo-icon">🤝</div>
      <div>
        <div class="logo-text">잇다<span style="color:var(--text-muted);font-weight:300"> ITDA</span></div>
        <div class="logo-sub">수어 인식 AI · 2단계: MediaPipe 좌표 추출</div>
      </div>
    </div>
    <div class="header-badges">
      <span class="badge badge-stage">STEP 2</span>
      <span class="badge badge-ws disconnected" id="ws-badge">WS 미연결</span>
    </div>
  </header>

  <!-- ── 메인 ─────────────────────────────────────────────── -->
  <div class="main">

    <!-- 비디오 뷰포트 -->
    <div class="video-zone">
      <video id="input-video" autoplay muted playsinline></video>
      <canvas id="output-canvas"></canvas>

      <!-- 카메라 미허용 플레이스홀더 -->
      <div class="cam-placeholder" id="cam-placeholder">
        <div class="cam-icon">📷</div>
        <p>카메라 권한을 허용하면<br/>손 관절 인식이 시작됩니다</p>
      </div>

      <!-- 손 감지 배너 -->
      <div class="no-hand-banner" id="no-hand-banner">
        손을 카메라 앞에 올려주세요 ✋
      </div>
    </div>

    <!-- 사이드 패널 -->
    <aside class="side-panel">

      <!-- 제어 -->
      <div class="panel-section">
        <div class="section-title">▶ 제어</div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <button class="btn btn-start" id="btn-start" disabled>
            <span>📡</span> 실시간 전송 시작
          </button>
          <button class="btn btn-stop" id="btn-stop" disabled>
            <span>⏹</span> 전송 중지
          </button>
          <div class="btn-row">
            <button class="btn btn-secondary" id="btn-overlay" title="관절 시각화 토글">
              👁 오버레이
            </button>
            <button class="btn btn-secondary" id="btn-copy-session" title="세션 ID 복사">
              📋 세션 ID
            </button>
          </div>
        </div>
      </div>

      <!-- 실시간 통계 -->
      <div class="panel-section">
        <div class="section-title">📊 실시간 통계</div>
        <div class="stat-grid">
          <div class="stat-item">
            <div class="stat-label">현재 FPS</div>
            <div class="stat-value" id="stat-fps">—</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">전송 프레임</div>
            <div class="stat-value" id="stat-frames">0</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">감지된 손</div>
            <div class="stat-value" id="stat-hands">0</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">세션 시간</div>
            <div class="stat-value" id="stat-time">00:00</div>
          </div>
        </div>
      </div>

      <!-- 좌표 로그 -->
      <div class="panel-section">
        <div class="section-title">📍 핵심 관절 좌표 (실시간)</div>
        <div class="coord-log" id="coord-log">
          <div class="empty">전송 시작 후 좌표가 표시됩니다...</div>
        </div>
      </div>

      <!-- 관절 인덱스 맵 -->
      <div class="panel-section">
        <div class="section-title">🗺️ 핵심 관절 (11개)</div>
        <div class="index-map" id="index-map"></div>
      </div>

      <!-- 세션 정보 -->
      <div class="panel-section">
        <div class="section-title">🔑 세션 정보</div>
        <div class="session-info">
          <div class="session-label">SESSION ID</div>
          <div id="session-id-display">—</div>
        </div>
      </div>

    </aside>
  </div>

  <!-- ── 푸터 ─────────────────────────────────────────────── -->
  <footer class="footer">
    <div class="footer-left">
      <div class="dot off" id="status-dot"></div>
      <span id="status-text">카메라 초기화 중...</span>
    </div>
    <div>잇다(ITDA) — 2단계 MediaPipe 비전 엔진 · <span id="ws-url-display">—</span></div>
  </footer>

</div>

<!-- ── 스크립트 ──────────────────────────────────────────────── -->
<script src="./js/vision.js"></script>
<script src="./js/overlay.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
//  ITDA Vision Client - 메인 진입점
//  MediaPipe 초기화 → 카메라 스트림 → 좌표 추출·전송·시각화
// ═══════════════════════════════════════════════════════════════

const videoEl    = document.getElementById("input-video");
const canvasEl   = document.getElementById("output-canvas");
const placeholder= document.getElementById("cam-placeholder");
const noHandBnr  = document.getElementById("no-hand-banner");
const btnStart   = document.getElementById("btn-start");
const btnStop    = document.getElementById("btn-stop");
const btnOverlay = document.getElementById("btn-overlay");
const btnCopy    = document.getElementById("btn-copy-session");
const wsBadge    = document.getElementById("ws-badge");
const statFPS    = document.getElementById("stat-fps");
const statFrames = document.getElementById("stat-frames");
const statHands  = document.getElementById("stat-hands");
const statTime   = document.getElementById("stat-time");
const coordLog   = document.getElementById("coord-log");
const statusDot  = document.getElementById("status-dot");
const statusText = document.getElementById("status-text");
const sessionDisp= document.getElementById("session-id-display");
const wsUrlDisp  = document.getElementById("ws-url-display");

// ── 세션 표시 ─────────────────────────────────────────────────
sessionDisp.textContent  = window.itdaSessionId;
wsUrlDisp.textContent    = ITDAVision.CONFIG.WS_URL;

// ── 관절 인덱스 맵 렌더링 ────────────────────────────────────
const indexNames = {
  0:"손목", 3:"검지 MCP", 4:"검지 끝",
  6:"중지 MCP", 8:"중지 끝", 10:"약지 MCP",
  12:"약지 끝", 14:"새끼 MCP", 16:"새끼 끝",
  18:"엄지 MCP", 20:"엄지 끝"
};
const mapEl = document.getElementById("index-map");
ITDAVision.CONFIG.ESSENTIAL_INDICES.forEach(idx => {
  mapEl.innerHTML += `
    <div class="index-item">
      <div class="idx-badge">${idx}</div>
      <div class="idx-name">${indexNames[idx]}</div>
    </div>`;
});

// ── 오버레이 초기화 ───────────────────────────────────────────
ITDAOverlay.init(canvasEl);

// ── 세션 타이머 ──────────────────────────────────────────────
let sessionStart = null;
let timerInterval = null;

function startTimer() {
  sessionStart = Date.now();
  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - sessionStart) / 1000);
    const m = String(Math.floor(elapsed / 60)).padStart(2, "0");
    const s = String(elapsed % 60).padStart(2, "0");
    statTime.textContent = `${m}:${s}`;
  }, 1000);
}
function stopTimer() {
  clearInterval(timerInterval);
  statTime.textContent = "00:00";
}

// ── 좌표 로그 업데이트 (최근 8줄 유지) ──────────────────────
let logBuffer = [];
function updateCoordLog(hands) {
  if (!hands || hands.length === 0) return;
  hands.forEach(hand => {
    const wrist = hand.keypoints[0];
    const tip   = hand.keypoints[2]; // INDEX_TIP
    logBuffer.push(
      `<div class="log-line">`+
      `<span class="hand">[${hand.handedness}]</span> `+
      `<span class="key">손목</span> `+
      `<span class="val">x=${wrist.x} y=${wrist.y}</span>  `+
      `<span class="key">검지끝</span> `+
      `<span class="val">x=${tip.x} y=${tip.y}</span>`+
      `</div>`
    );
  });
  if (logBuffer.length > 8) logBuffer = logBuffer.slice(-8);
  coordLog.innerHTML = logBuffer.join("");
  coordLog.scrollTop = coordLog.scrollHeight;
}

// ── MediaPipe 결과 핸들러 (vision.js 콜백 래핑) ─────────────
let frameCountDisplay = 0;
const origHandler = ITDAVision.onHandsResults;
ITDAVision.onHandsResults = function(results) {
  origHandler(results);

  // canvas 크기를 비디오에 맞춤
  if (canvasEl.width !== videoEl.videoWidth && videoEl.videoWidth > 0) {
    canvasEl.width  = videoEl.videoWidth;
    canvasEl.height = videoEl.videoHeight;
  }

  // 오버레이 렌더링
  const fps = parseFloat(ITDAVision.getConfig().currentFPS) || 0;
  ITDAOverlay.draw(results, fps);

  // UI 업데이트
  const handCount = results?.multiHandLandmarks?.length ?? 0;
  statHands.textContent = handCount;
  noHandBnr.classList.toggle("hidden", handCount > 0);

  if (ITDAVision.getConfig().isStreaming) {
    frameCountDisplay++;
    statFrames.textContent = frameCountDisplay;
    if (handCount > 0 && results.multiHandLandmarks) {
      // hands 배열 재구성 (로그 표시용)
      const hands = results.multiHandLandmarks.map((lm, i) => ({
        handedness: results.multiHandedness?.[i]?.label ?? "?",
        keypoints: ITDAVision.CONFIG.ESSENTIAL_INDICES.map(idx => ({
          x: +lm[idx].x.toFixed(4),
          y: +lm[idx].y.toFixed(4),
          z: +lm[idx].z.toFixed(4),
        })),
      }));
      updateCoordLog(hands);
    }
  }
};

// ── FPS 표시 업데이트 ────────────────────────────────────────
window.addEventListener("itda:fps:update", (e) => {
  const fps = parseFloat(e.detail.fps);
  statFPS.textContent = fps.toFixed(1);
  statFPS.className = "stat-value" + (fps >= 30 ? "" : fps >= 15 ? " warn" : " bad");
});

// ── WebSocket 상태 연동 ───────────────────────────────────────
window.addEventListener("itda:ws:open", () => {
  wsBadge.textContent = "WS 연결됨";
  wsBadge.classList.remove("disconnected");
});
window.addEventListener("itda:ws:close", () => {
  wsBadge.textContent = "WS 미연결";
  wsBadge.classList.add("disconnected");
});

// ── MediaPipe Hands 초기화 ───────────────────────────────────
const hands = new Hands({
  locateFile: (file) =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
});

hands.setOptions({
  maxNumHands:         2,
  modelComplexity:     1,       // 0=경량, 1=균형, (복잡도 낮출수록 모바일 성능↑)
  minDetectionConfidence: 0.7,
  minTrackingConfidence:  0.6,
});

hands.onResults(ITDAVision.onHandsResults);

// ── 카메라 스트림 시작 ───────────────────────────────────────
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        width:  { ideal: 1280 },
        height: { ideal: 720  },
        frameRate: { ideal: 60 },  // 브라우저가 허용하는 최대 fps 요청
      },
    });
    videoEl.srcObject = stream;
    videoEl.onloadedmetadata = () => {
      canvasEl.width  = videoEl.videoWidth;
      canvasEl.height = videoEl.videoHeight;
      placeholder.classList.add("hidden");
      btnStart.disabled = false;
      setStatus("카메라 준비 완료 — 전송 시작 버튼을 눌러주세요", false);
    };

    // requestAnimationFrame 기반 MediaPipe 처리 루프 (30fps 이상 보장)
    let lastProcess = 0;
    async function processLoop(ts) {
      // 최소 간격: 16ms (≈ 60fps 상한)
      if (ts - lastProcess >= 16 && videoEl.readyState >= 2) {
        await hands.send({ image: videoEl });
        lastProcess = ts;
      }
      requestAnimationFrame(processLoop);
    }
    requestAnimationFrame(processLoop);

  } catch (err) {
    console.error("[ITDA] 카메라 접근 실패:", err);
    setStatus("❌ 카메라 권한이 거부되었습니다", false);
    placeholder.querySelector("p").textContent =
      "카메라 권한을 허용한 후 새로고침 해주세요.";
  }
}

// ── 버튼 이벤트 ──────────────────────────────────────────────
btnStart.addEventListener("click", () => {
  ITDAVision.startStreaming();
  btnStart.disabled = true;
  btnStop.disabled  = false;
  frameCountDisplay = 0;
  coordLog.innerHTML = '<div class="empty">좌표 수신 중...</div>';
  setStatus("📡 실시간 좌표 전송 중", true);
  startTimer();
});

btnStop.addEventListener("click", () => {
  ITDAVision.stopStreaming();
  btnStop.disabled  = true;
  btnStart.disabled = false;
  setStatus("⏹ 전송 중지됨 — 재시작하려면 버튼을 누르세요", false);
  stopTimer();
  logBuffer = [];
});

btnOverlay.addEventListener("click", () => {
  ITDAOverlay.toggle();
  const cfg = ITDAVision.getConfig();
  btnOverlay.style.color = cfg.isStreaming ? "" : "var(--text-muted)";
});

btnCopy.addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(window.itdaSessionId);
    btnCopy.textContent = "✅ 복사됨";
    setTimeout(() => { btnCopy.innerHTML = "📋 세션 ID"; }, 2000);
  } catch { }
});

// ── 상태 표시 유틸 ───────────────────────────────────────────
function setStatus(msg, active) {
  statusText.textContent = msg;
  statusDot.className = "dot" + (active ? "" : " off");
}

// ── 시작 ─────────────────────────────────────────────────────
startCamera();
</script>
</body>
</html>
