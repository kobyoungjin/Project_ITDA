<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>잇다(ITDA) — 5단계: 얼굴 표정 + 손동작 동기화</title>
  <meta name="description" content="MediaPipe FaceLandmarker + Hands로 수어 비수지 기호(표정)와 수지 동작(손)을 3D 아바타에 실시간 동기화 — 잇다 프로젝트 5단계" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    /* ── Cyborg Alpha 명세 변수 ─────────────────────────── */
    :root {
      --alpha-ceramic:   #D7D1C7;
      --alpha-rosegold:  #F3A289;
      --alpha-sapphire:  #00BFFF;
      --alpha-bg-deep:   #050810;
      --alpha-alert-low: #00BFFF;
      --alpha-alert-med: #FFA500;
      --alpha-alert-high: #FF2200;
      
      --bg-glass:   rgba(15, 23, 42, 0.7);
      --border:     rgba(255, 255, 255, 0.1);
    }

    body {
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      background: var(--alpha-bg-deep);
      color: #fff;
      margin: 0; overflow: hidden;
    }

    /* ── 데이터 펄싱 효과 (Fiber Optics) ── */
    @keyframes pulse-glow {
      0% { box-shadow: 0 0 5px var(--alpha-sapphire); }
      50% { box-shadow: 0 0 20px var(--alpha-sapphire); }
      100% { box-shadow: 0 0 5px var(--alpha-sapphire); }
    }

    /* ── 보안 대시보드 레이아웃 ── */
    #security-dashboard {
      position: absolute; inset: 0;
      pointer-events: none;
      z-index: 100;
    }

    .panel {
      position: absolute;
      background: var(--bg-glass);
      backdrop-filter: blur(15px);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0.8;
    }

    /* Radar Map */
    #radar-panel {
      top: 80px; left: 50%; transform: translateX(-50%);
      width: 180px; height: 180px; border-radius: 50%;
      border: 2px solid var(--alpha-sapphire);
      display: flex; align-items: center; justify-content: center;
    }
    #radar-circle {
      width: 90%; height: 90%; border-radius: 50%;
      background: repeating-radial-gradient(circle, transparent 0, transparent 20px, rgba(0, 191, 255, 0.1) 21px);
      border: 1px solid rgba(0, 191, 255, 0.3);
      position: relative;
    }
    #radar-sweep {
      position: absolute; inset: 0;
      background: conic-gradient(from 0deg, transparent 0deg, var(--alpha-sapphire) 360deg);
      opacity: 0.2; border-radius: 50%;
      animation: spin 3s linear infinite;
    }

    /* Damage Meter */
    #damage-panel { top: 100px; right: 20px; width: 160px; }
    
    /* Audio Spectrum */
    #audio-panel { top: 100px; left: 20px; width: 160px; height: 80px; }

    /* Threat Progress Bar */
    #threat-panel { bottom: 120px; left: 40px; width: 220px; }

    /* Warning Strip */
    #warning-strip {
      bottom: 0; left: 0; width: 100%;
      height: 40px; background: rgba(255, 34, 0, 0.1);
      border-top: 1px solid var(--alpha-alert-high);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; letter-spacing: 0.2em; color: var(--alpha-alert-high);
      text-transform: uppercase;
    }

    .status-badge {
      font-size: 0.7rem; font-weight: 800;
      padding: 2px 8px; border-radius: 4px;
      margin-bottom: 8px; display: inline-block;
      background: var(--alpha-sapphire); color: #000;
    }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  </style>
</head>
<body>

  <header style="position: absolute; top:0; width:100%; z-index:200; display:flex; justify-content:space-between; padding: 15px 25px; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);">
    <div style="font-weight:900; letter-spacing:-1px; color: var(--alpha-rosegold);">
      STORM_ALERT_NODE_09 <span style="color:#fff; font-weight:300;">/ KSL_CYBORG_ALPHA_17</span>
    </div>
    <div id="alert-status-text" style="color: var(--alpha-alert-low); font-weight:800;">STATUS: NORMAL</div>
  </header>

  <main>
    <canvas id="three-canvas"></canvas>

    <!-- ── SECURITY DASHBOARD ── -->
    <div id="security-dashboard">
      <!-- Radar -->
      <div id="radar-panel" class="panel">
        <div id="radar-circle">
          <div id="radar-sweep"></div>
        </div>
        <div style="position: absolute; bottom: -25px; font-size: 0.6rem; color: var(--alpha-sapphire);">GRAFFITI_RADAR_ACTIVE</div>
      </div>

      <!-- Audio -->
      <div id="audio-panel" class="panel">
        <div class="status-badge">SED_AUDIO</div>
        <div style="height: 30px; display:flex; align-items:flex-end; gap:2px;">
          <div style="flex:1; background:var(--alpha-sapphire); height:40%"></div>
          <div style="flex:1; background:var(--alpha-sapphire); height:80%"></div>
          <div style="flex:1; background:var(--alpha-sapphire); height:60%"></div>
          <div style="flex:1; background:var(--alpha-sapphire); height:90%"></div>
          <div style="flex:1; background:var(--alpha-sapphire); height:30%"></div>
        </div>
      </div>

      <!-- Damage -->
      <div id="damage-panel" class="panel">
        <div class="status-badge">YOLO_V11_DETECTION</div>
        <div style="font-size: 1.2rem; font-weight:800;" id="damage-val">0.00 <span style="font-size:0.7rem;">m²</span></div>
        <div style="font-size: 0.6rem; color: var(--text-muted);">ESTIMATED DAMAGE AREA</div>
      </div>

      <!-- Threat -->
      <div id="threat-panel" class="panel">
        <div class="status-badge">CONFIDENCE</div>
        <div style="height: 8px; background:rgba(255,255,255,0.1); border-radius:4px; overflow:hidden;">
          <div id="threat-bar" style="width: 0%; height:100%; background: var(--alpha-sapphire); transition: width 0.3s;"></div>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:5px; font-size:0.6rem;">
          <span>0%</span>
          <span id="threat-pct">0%</span>
        </div>
      </div>

      <!-- Warning Strip -->
      <div id="warning-strip">
        <span id="warning-text">Monitoring Zone Alpha-17...</span>
      </div>
    </div>

    <!-- 컨트롤 버튼 -->
    <div class="controls">
      <button class="btn-circle" id="btn-reset" title="아바타 리셋">🔄</button>
      <button class="btn-circle" id="btn-cam"   title="카메라 뷰 리셋">🎥</button>
    </div>

    <!-- 비전 처리용 숨겨진 video/canvas (vision.js 필수 요소) -->
    <video id="vision-video" playsinline autoplay muted
      style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;"></video>
    <canvas id="vision-canvas"
      style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;"></canvas>

    <!-- 비전 로딩 오버레이 -->
    <div id="vision-overlay">
      <div class="loading-spinner"></div>
      <div class="loading-text">MediaPipe 모델 로딩 중...</div>
      <div id="vision-status">초기화 준비 중</div>
    </div>
  </main>

  <!-- ── Three.js Import Map ─────────────────────────── -->
  <script type="importmap">
    {
      "imports": {
        "three":          "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/":  "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <!-- ── 모듈 로딩 ── -->
  <script type="module" src="./js/avatar.js"></script>
  <script type="module" src="./js/retargeting.js"></script>
  <script type="module" src="./js/vision.js"></script>

  <script type="module">
    // [Cyborg Alpha] 전역 상태 제어
    const THEME = {
      Low:    { color: '#00BFFF', text: 'NORMAL',  strip: 'rgba(0,191,255,0.1)' },
      Medium: { color: '#FFA500', text: 'WARNING', strip: 'rgba(255,165,0,0.1)' },
      High:   { color: '#FF2200', text: 'ALERT',   strip: 'rgba(255,34,0,0.2)' }
    };

    window.addEventListener('itda:vision:ready', () => {
      console.info('[Cyborg Alpha] System Initialized.');
    });

    // ── 백엔드 통합 데이터 수신 (경고 레벨 + NMS 가이드) ──
    window.addEventListener('itda:rag:result', (e) => {
      const ack = e.detail;
      const res = ack.rag_result;
      const alertLevel = ack.alert_level || 'Low';
      const nms = ack.nms_guide || {};
      const conf = (ack.confidence_score || 0) * 100;

      // 1. UI 테마 및 텍스트 업데이트
      updateSystemTheme(alertLevel);
      
      // 2. 대시보드 패널 업데이트
      document.getElementById('threat-bar').style.width = `${conf}%`;
      document.getElementById('threat-pct').textContent = `${conf.toFixed(1)}%`;
      document.getElementById('warning-text').textContent = res.text || 'Scanning...';
      
      if (res.detected_area_m2 !== undefined) {
         document.getElementById('damage-val').innerHTML = `${res.detected_area_m2.toFixed(2)} <span style="font-size:0.7rem;">m²</span>`;
      }

      // 3. 아바타 리타겟팅 엔진에 NMS 가이드 전달
      if (window.ITDARetargeting5) {
        window.ITDARetargeting5.applyExternalNMS(nms, alertLevel);
      }
    });

    function updateSystemTheme(level) {
      const theme = THEME[level] || THEME.Low;
      
      // CSS 변수 실시간 변경 (아바타 라이팅 등에 자동 반영)
      document.documentElement.style.setProperty('--alpha-sapphire', theme.color);
      
      const statusText = document.getElementById('alert-status-text');
      statusText.textContent = `STATUS: ${theme.text}`;
      statusText.style.color = theme.color;
      
      const strip = document.getElementById('warning-strip');
      strip.style.background = theme.strip;
      strip.style.borderColor = theme.color;
      strip.style.color = theme.color;

      // 아바타 광섬유 이펙트 속도 조절
      if (window.ITDAAvatar5) {
        const pulseHz = level === 'High' ? 5.0 : (level === 'Medium' ? 2.0 : 0.8);
        window.ITDAAvatar5.updateFiberPulse(pulseHz, theme.color);
      }
    }

    // 자동 시작
    setTimeout(() => {
      if (window.ITDAVision5) window.ITDAVision5.init();
    }, 1000);
  </script>

</body>
</html>
