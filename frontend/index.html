<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ITDA — 소리가 없어도, 우리는 이어집니다</title>
  <meta name="description" content="인공지능 수어 통역 서비스 ITDA" />
  <meta name="theme-color" content="#E76F51" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
    rel="stylesheet" />

  <style>
    /* ── Design System: Warm Connection ─────────────────── */
    :root {
      --surface: #fff8f6;
      --surface-dim: #ead6d1;
      --surface-container: #ffe9e4;
      --surface-container-high: #f9e4df;
      --on-surface: #241916;
      --on-surface-variant: #57423d;
      --primary: #a33d23;
      --primary-container: #e76f51;
      --on-primary: #ffffff;
      --on-primary-container: #590f00;
      --secondary: #625d5b;
      --secondary-container: #e9e1dd;
      --tertiary: #006a63;
      --tertiary-container: #00a49a;
      --outline: #8a716c;
      --outline-variant: #dec0b9;
      --inverse-surface: #3a2e2b;
      --inverse-on-surface: #ffede9;
      --error: #ba1a1a;
      --white: #ffffff;
      --text-base: #2e2520;
      --text-muted: #78716c;
      --shadow-card: 0px 4px 20px rgba(46, 37, 32, 0.06);
      --rounded-sm: 0.25rem;
      --rounded: 0.5rem;
      --rounded-md: 0.75rem;
      --rounded-lg: 1rem;
      --rounded-xl: 1.5rem;
      --rounded-2xl: 1rem;
      --rounded-full: 9999px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--surface);
      color: var(--text-base);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #app-container {
      width: 100%;
      max-width: 430px;
      height: 100%;
      max-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      overflow: hidden;
    }

    .hidden {
      display: none !important;
    }

    /* ── Landing Page ──────────────────────────────────── */
    #landing-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem;
      background: linear-gradient(180deg, var(--surface) 0%, var(--surface-container) 100%);
    }

    .landing-logo {
      width: 160px;
      height: 160px;
      position: relative;
    }

    .landing-logo svg {
      width: 100%;
      height: 100%;
    }

    /* ITDA petal-style logo */
    .petal {
      transition: transform 0.3s ease;
    }

    .landing-logo:hover .petal {
      transform: scale(1.05);
      transform-origin: center;
    }

    .landing-title {
      font-size: 28px;
      font-weight: 900;
      line-height: 1.2;
      text-align: center;
      color: var(--on-surface);
      letter-spacing: -0.02em;
    }

    .landing-subtitle {
      font-size: 16px;
      font-weight: 400;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
    }

    .btn-start {
      width: 100%;
      max-width: 300px;
      padding: 1rem;
      border: none;
      border-radius: var(--rounded-xl);
      background: var(--primary-container);
      color: var(--on-primary);
      font-family: inherit;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(231, 111, 81, 0.3);
    }

    .btn-start:hover {
      background: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(231, 111, 81, 0.4);
    }

    .btn-start:active {
      transform: translateY(0);
    }

    .landing-lang {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* ── Main App View ─────────────────────────────────── */
    #app-view {
      flex: 1;
      display: none;
      flex-direction: column;
      height: 100%;
    }

    /* ── Header ────────────────────────────────────────── */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.25rem;
      background: var(--white);
      border-bottom: 1px solid var(--outline-variant);
      z-index: 20;
    }

    .app-header-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-back {
      width: 32px;
      height: 32px;
      border: none;
      background: none;
      font-size: 18px;
      cursor: pointer;
      color: var(--on-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--rounded);
    }

    .btn-back:hover {
      background: var(--surface-container);
    }

    .status-dot {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 13px;
      font-weight: 500;
      color: var(--primary-container);
    }

    .status-dot::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary-container);
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    .btn-settings {
      width: 32px;
      height: 32px;
      border: none;
      background: none;
      font-size: 18px;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--rounded);
    }

    .btn-settings:hover {
      background: var(--surface-container);
    }

    /* ── Mode Toggle ───────────────────────────────────── */
    .mode-toggle-bar {
      display: flex;
      padding: 0.5rem 1.25rem;
      gap: 0.5rem;
      background: var(--white);
    }

    .mode-tab {
      flex: 1;
      padding: 0.6rem;
      border: none;
      border-radius: var(--rounded-lg);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .mode-tab.active {
      background: var(--primary-container);
      color: var(--on-primary);
      box-shadow: 0 2px 8px rgba(231, 111, 81, 0.3);
    }

    .mode-tab:not(.active) {
      background: var(--secondary-container);
      color: var(--on-surface-variant);
    }

    .mode-tab:not(.active):hover {
      background: var(--surface-dim);
    }

    /* ── Content Area ──────────────────────────────────── */
    .content-area {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--surface);
    }

    /* ── Voice-to-Sign Mode (screen1) ──────────────────── */
    #voice-to-sign {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem 1.25rem;
      gap: 1rem;
      position: relative;
    }

    .btn-replay {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.6rem 1.2rem;
      border-radius: var(--rounded-full);
      background: var(--white);
      border: 1px solid var(--outline-variant);
      color: var(--primary-container);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .btn-replay:hover {
      background: var(--surface-container);
      border-color: var(--primary-container);
    }

    .btn-replay:active {
      transform: scale(0.95);
    }

    #voice-to-sign .translation-card {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.75rem;
      border-radius: var(--rounded-full);
      background: rgba(231, 111, 81, 0.1);
      color: var(--primary-container);
      font-size: 12px;
      font-weight: 700;
    }

    .live-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--primary-container);
    }

    /* Video circle player */
    .video-circle {
      width: 320px;
      height: 400px;
      border-radius: 20%;
      overflow: hidden;
      border: 4px solid var(--surface-dim);
      box-shadow: 0 8px 40px rgba(46, 37, 32, 0.1);
      position: relative;
      background: var(--surface-container);
      flex-shrink: 0;
      padding-bottom: 10%;
    }

    .video-circle video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-circle-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      text-align: center;
      padding: 0.5rem;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.5));
      color: white;
      font-size: 12px;
      font-weight: 500;
    }

    /* Audio waveform placeholder */
    .audio-wave {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 32px;
      padding: 0 1rem;
      margin-bottom: 20%;
    }

    .audio-wave-bar {
      width: 3px;
      height: 8px;
      background: var(--primary-container);
      border-radius: 2px;
      animation: wave-anim 0.8s ease-in-out infinite alternate;
    }

    .audio-wave-bar:nth-child(1) {
      animation-delay: 0s;
      height: 12px;
    }

    .audio-wave-bar:nth-child(2) {
      animation-delay: 0.1s;
      height: 20px;
    }

    .audio-wave-bar:nth-child(3) {
      animation-delay: 0.2s;
      height: 16px;
    }

    .audio-wave-bar:nth-child(4) {
      animation-delay: 0.3s;
      height: 24px;
    }

    .audio-wave-bar:nth-child(5) {
      animation-delay: 0.15s;
      height: 18px;
    }

    .audio-wave-bar:nth-child(6) {
      animation-delay: 0.25s;
      height: 14px;
    }

    .audio-wave-bar:nth-child(7) {
      animation-delay: 0.05s;
      height: 10px;
    }

    .audio-wave.idle .audio-wave-bar {
      animation: none;
      height: 4px;
      opacity: 0.4;
    }

    @keyframes wave-anim {
      to {
        height: 4px;
      }
    }

    /* ── Sign-to-Voice Mode (screen2) ──────────────────── */
    #sign-to-voice {
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
    }

    .camera-area {
      flex: 1;
      position: relative;
      background: var(--inverse-surface);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .camera-area video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .camera-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 70%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: var(--rounded-xl);
      pointer-events: none;
    }

    .camera-frame::before,
    .camera-frame::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: var(--on-primary);
      border-style: solid;
    }

    .camera-frame::before {
      top: -1px;
      left: -1px;
      border-width: 3px 0 0 3px;
      border-radius: 4px 0 0 0;
    }

    .camera-frame::after {
      bottom: -1px;
      right: -1px;
      border-width: 0 3px 3px 0;
      border-radius: 0 0 4px 0;
    }

    .camera-hint {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.5);
      color: white;
      padding: 0.4rem 1rem;
      border-radius: var(--rounded-full);
      font-size: 13px;
      font-weight: 500;
    }

    /* ── Translation Result Card ───────────────────────── */
    .translation-card {
      background: var(--white);
      border-radius: var(--rounded-xl) var(--rounded-xl) 0 0;
      padding: 1.25rem;
      box-shadow: 0 -4px 20px rgba(46, 37, 32, 0.08);
    }

    .translation-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .translation-text {
      font-size: 18px;
      font-weight: 700;
      color: var(--on-surface);
      line-height: 1.5;
    }

    .translation-text .highlight {
      color: var(--primary-container);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ── Bottom Input Bar ──────────────────────────────── */
    .input-bar {
      padding: 0.75rem 1.25rem;
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
      background: var(--white);
      border-top: 1px solid var(--outline-variant);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .input-field-wrap {
      flex: 1;
      position: relative;
    }

    #chat-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--outline-variant);
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      color: var(--on-surface);
      background: var(--white);
      outline: none;
      transition: border-color 0.2s;
    }

    #chat-input:focus {
      border-color: var(--primary-container);
    }

    #chat-input::placeholder {
      color: var(--text-muted);
    }

    .btn-mic-new {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: var(--primary-container);
      color: var(--on-primary);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(231, 111, 81, 0.3);
      flex-shrink: 0;
    }

    .btn-mic-new:hover {
      background: var(--primary);
      transform: scale(1.05);
    }

    .btn-mic-new.recording {
      background: var(--error);
      animation: pulse-mic 1.5s infinite;
    }

    @keyframes pulse-mic {
      0% {
        box-shadow: 0 0 0 0 rgba(186, 26, 26, 0.4);
      }

      70% {
        box-shadow: 0 0 0 12px rgba(186, 26, 26, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(186, 26, 26, 0);
      }
    }

    .btn-send-new {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--inverse-surface);
      color: var(--inverse-on-surface);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .btn-send-new:hover {
      background: var(--on-surface);
      transform: scale(1.05);
    }

    /* ── Emotion / Status Output ───────────────────────── */
    #emotion-output {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-muted);
      padding: 0 0.25rem;
      min-height: 1.5em;
    }

    /* ── Preload Bar ───────────────────────────────────── */
    #preload-bar {
      display: none;
      padding: 0.5rem 1.25rem;
      font-size: 12px;
      color: var(--text-muted);
      background: var(--white);
    }

    .preload-track {
      height: 3px;
      background: var(--surface-container);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 4px;
    }

    #preload-fill {
      height: 100%;
      background: var(--primary-container);
      width: 0%;
      transition: width 0.3s;
    }

    /* ── Ref Video (inside .video-circle, double-buffered) ── */
    #ref-pip {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 5;
      border-radius: 20%;
      overflow: hidden;
    }

    #ref-pip.video-mode-active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #ref-pip.video-mode-active video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #btn-close-ref {
      display: none;
    }

    /* ── Vision Overlay (loading) ──────────────────────── */
    #vision-overlay {
      position: absolute;
      inset: 0;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 50;
      transition: opacity 0.4s;
    }

    #vision-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--surface-dim);
      border-top-color: var(--primary-container);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      font-size: 15px;
      color: var(--text-muted);
    }

    #vision-status {
      font-size: 13px;
      color: var(--primary-container);
      font-weight: 500;
    }

    /* ── Three.js canvas (hidden in video-first mode) ──── */
    #three-canvas {
      display: none;
    }

    /* ── Responsive ────────────────────────────────────── */
    @media (max-width: 430px) {
      #app-container {
        max-width: 100%;
      }

      .video-circle {
        width: 220px;
        height: 220px;
      }
    }

    @media (min-height: 800px) {
      .video-circle {
        width: 320px;
        height: 400px;
      }
    }
  </style>
</head>

<body>

  <div id="app-container">

    <!-- ══════════════════════════════════════════════════ -->
    <!-- LANDING VIEW                                       -->
    <!-- ══════════════════════════════════════════════════ -->
    <div id="landing-view">
      <div class="landing-logo">
        <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- ITDA flower/petal logo -->
          <ellipse class="petal" cx="100" cy="72" rx="28" ry="38" fill="#5B9BD5" transform="rotate(0 100 100)"
            opacity="0.9" />
          <ellipse class="petal" cx="127" cy="85" rx="28" ry="38" fill="#4A8AC4" transform="rotate(72 100 100)"
            opacity="0.85" />
          <ellipse class="petal" cx="117" cy="115" rx="28" ry="38" fill="#3A7AB3" transform="rotate(144 100 100)"
            opacity="0.8" />
          <ellipse class="petal" cx="83" cy="115" rx="28" ry="38" fill="#2E6DA2" transform="rotate(216 100 100)"
            opacity="0.8" />
          <ellipse class="petal" cx="73" cy="85" rx="28" ry="38" fill="#4A8AC4" transform="rotate(288 100 100)"
            opacity="0.85" />
          <circle cx="100" cy="98" r="16" fill="#fff" />
          <text x="100" y="104" text-anchor="middle" font-family="Noto Sans KR" font-size="13" font-weight="900"
            fill="#3A7AB3">ITDA</text>
        </svg>
      </div>

      <div class="landing-title">소리가 없어도,<br />우리는 이어집니다</div>
      <div class="landing-subtitle">인공지능 수어 통역 서비스 ITDA</div>

      <button class="btn-start" id="btn-start">시작하기</button>

      <div class="landing-lang">🌐 한국어 (KSL)</div>
    </div>

    <!-- ══════════════════════════════════════════════════ -->
    <!-- MAIN APP VIEW                                      -->
    <!-- ══════════════════════════════════════════════════ -->
    <div id="app-view">

      <!-- Header -->
      <div class="app-header">
        <div class="app-header-left">
          <button class="btn-back" id="btn-back-landing" title="홈으로">✕</button>
          <span class="status-dot" id="phase-badge">ITDA</span>
        </div>
        <button class="btn-back" id="btn-back-from-app" title="뒤로가기">◁</button>
      </div>

      <!-- Mode Toggle -->
      <div class="mode-toggle-bar">
        <button class="mode-tab active" data-mode="voice-to-sign" id="tab-v2s">
          <span>🗣️</span> 음성→수어
        </button>
        <button class="mode-tab" data-mode="sign-to-voice" id="tab-s2v">
          <span>🤟</span> 수어→음성
        </button>
      </div>

      <!-- Content -->
      <div class="content-area">

        <!-- ── Voice-to-Sign Mode ──────────────────────── -->
        <div id="voice-to-sign">

          <!-- Video circle for sign language playback -->
          <div class="video-circle" id="video-circle">
            <video id="ref-video-circle" muted playsinline></video>
            <!-- ref-pip: motion_loader_v3.js가 수어 영상을 여기에 재생 -->
            <div id="ref-pip">
              <button id="btn-close-ref">✕</button>
              <video id="ref-video-0" muted playsinline style="display:block;"></video>
              <video id="ref-video-1" muted playsinline style="display:none;"></video>
            </div>
          </div>

          <button class="btn-replay" id="btn-replay" title="다시 실행">🔄 다시 실행</button>

          <!-- Audio waveform -->
          <div class="audio-wave idle" id="audio-wave">
            <div class="audio-wave-bar"></div>
            <div class="audio-wave-bar"></div>
            <div class="audio-wave-bar"></div>
            <div class="audio-wave-bar"></div>

            <div class="audio-wave-bar"></div>
            <div class="audio-wave-bar"></div>

          <!-- Translation result -->
          <div class="translation-card">

            <div id="preload-bar">

        <div id="sign-to-voice">
          <div class="camera-area">
            <video id="vision-video" autoplay muted playsinline></video>

              style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transform:scaleX(-1);"></canvas>

          <div class="translation-card">

        <!-- Vision loading overlay -->
        <div id="vision-overlay" class="hidden">
          <div class="loading-spinner"></div>
          <div class="loading-text">모델 로딩 중...</div>
          <div id="vision-status">초기화 준비 중</div>

        <!-- Three.js canvas (hidden) -->
        <canvas id="three-canvas"></canvas>

      <!-- Bottom Input Bar -->
      <div class="input-bar">
        <div class="input-field-wrap">
          <input type="text" id="chat-input" placeholder="번역할 내용을 입력하세요..." />
        </div>
        <button class="btn-send-new" id="btn-send" title="전송">➤</button>
        <button class="btn-mic-new" id="btn-mic" title="음성 인식">🎤</button>

  <!-- These IDs are referenced by existing JS modules but not shown in new design -->

  <!-- ── Module Scripts ───────────────────────────────── -->

  <script type="module" src="./js/translator.js?v=20260609b"></script>

  <script type="module" src="./js/motion_loader_v3.js?v=20260609b"></script>

  <!-- ── App Logic ────────────────────────────────────── -->
  <script type="module">
    // ── 모바일 비디오 unlock (한 번만 실행) ──
    // 사용자 제스처 시점에 모든 video를 play→pause하여 브라우저의 autoplay 정책을 해제.
    // 이후 프로그래밍 방식 play()가 src 변경 후에도 허용됨.
    let _videosUnlocked = false;
    function unlockAllVideos() {
      if (_videosUnlocked) return;
      _videosUnlocked = true;
      document.querySelectorAll('video').forEach(v => {
        v.muted = true;
        const p = v.play();
        if (p) p.then(() => v.pause()).catch(() => {});
      });
      console.info('[ITDA] 모바일 비디오 unlock 완료');
    }

    // 백업: 어떤 터치든 첫 번째 터치에서 unlock
    document.addEventListener('touchstart', () => unlockAllVideos(), { once: true });
    document.addEventListener('click', () => unlockAllVideos(), { once: true });

    // ── Landing → App transition ──
    document.getElementById('btn-start').addEventListener('click', () => {
      unlockAllVideos();
      document.getElementById('landing-view').style.display = 'none';
      const appView = document.getElementById('app-view');
      appView.style.display = 'flex';
    });

    document.getElementById('btn-back-landing').addEventListener('click', () => {
      document.getElementById('app-view').style.display = 'none';
      document.getElementById('landing-view').style.display = 'flex';
    });

    // ── Mode tab switching ──
    const tabs = document.querySelectorAll('.mode-tab');
    const v2sView = document.getElementById('voice-to-sign');
    const s2vView = document.getElementById('sign-to-voice');

    function switchMode(mode) {
      tabs.forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
      if (mode === 'voice-to-sign') {
        v2sView.style.display = 'flex';
        s2vView.style.display = 'none';
      } else {
        v2sView.style.display = 'none';
        s2vView.style.display = 'flex';
      }
    }

    tabs.forEach(t => t.addEventListener('click', () => switchMode(t.dataset.mode)));

    // ── Audio wave animation ──
    const waveEl = document.getElementById('audio-wave');
    window.addEventListener('itda:stt:state', (e) => {
      if (e.detail === 'listening') {
        waveEl.classList.remove('idle');
      } else {
        waveEl.classList.add('idle');
      }
    });

    // ── Mic button ──
    const micBtn = document.getElementById('btn-mic');
    micBtn.addEventListener('click', () => {
      if (window.ITDAStt) {
        window.ITDAStt.toggle();
        micBtn.classList.toggle('recording');
        const wave = document.getElementById('audio-wave');
        wave.classList.toggle('idle');
      }
    });

    // ── Vision overlay auto-hide (vision.js disabled) ──
    if (!document.querySelector('script[src*="vision.js"]')) {
      const overlay = document.getElementById('vision-overlay');
      if (overlay) overlay.classList.add('hidden');
    }
    window.addEventListener('itda:vision:ready', () => {
      document.getElementById('vision-overlay')?.classList.add('hidden');
    });

    // ── Preload progress ──
    window.addEventListener('itda:preload:progress', (e) => {
      const { loaded, total } = e.detail;
      const bar = document.getElementById('preload-bar');
      const text = document.getElementById('preload-text');
      const fill = document.getElementById('preload-fill');
      if (bar) bar.style.display = 'block';
      if (text) text.textContent = `수어 영상 준비 중... ${loaded}/${total}`;
      if (fill) fill.style.width = `${(loaded / total * 100).toFixed(0)}%`;
    });
    window.addEventListener('itda:preload:complete', () => {
      const bar = document.getElementById('preload-bar');
      const text = document.getElementById('preload-text');
      if (text) text.textContent = '수어 영상 준비 완료!';
      setTimeout(() => { if (bar) bar.style.display = 'none'; }, 2000);
    });

    // ── Ref video close ──
    document.getElementById('btn-close-ref').addEventListener('click', () => {
      document.getElementById('ref-pip').style.display = 'none';
      for (const vid of [document.getElementById('ref-video-0'), document.getElementById('ref-video-1')]) {
        if (vid) { vid.pause(); vid.src = ''; }
      }
    });

    // ── 다시 실행 버튼: 마지막 번역 텍스트를 다시 전송 ──
    const replayBtn = document.getElementById('btn-replay');
    if (replayBtn) {
      const doReplay = (e) => {
        e.preventDefault();
        if (window.ITDATranslator?.replayLast) {
          window.ITDATranslator.replayLast();
        }
      };
      replayBtn.addEventListener('click', doReplay);
      replayBtn.addEventListener('touchend', doReplay);
    }

    // ── 뒤로가기 버튼: 랜딩 페이지로 ──
    document.getElementById('btn-back-from-app')?.addEventListener('click', () => {
      document.getElementById('app-view').style.display = 'none';
      document.getElementById('landing-view').style.display = 'flex';
    });

    // ── Stub handlers for compatibility ──
    document.getElementById('btn-play-word')?.addEventListener('click', () => {
      window.ITDAMotionV3?.play('WORD0001');
    });
    document.getElementById('btn-reset')?.addEventListener('click', () => {
      window.ITDAAvatar5?.reset();
    });

    // ── Education mode (hidden, for JS compat) ──
    const modeBtns = document.querySelectorAll('#mode-toggle .mode-btn');
    modeBtns.forEach(b => b.addEventListener('click', () => { }));
    document.getElementById('lesson-prev')?.addEventListener('click', () => { });
    document.getElementById('lesson-next')?.addEventListener('click', () => { });
    document.getElementById('lesson-stop')?.addEventListener('click', () => { });

    window.addEventListener('itda:lesson:feedback', (e) => {
      const d = e.detail || {};
      const el = document.getElementById('lesson-status');
      if (el && d.status) el.dataset.state = d.status;
    });

    // ── RAG result display ──
    window.addEventListener('itda:rag:result', (e) => {
      const result = e.detail?.rag_result;
      if (!result) return;
      const outputEl = document.getElementById('slm-output');
      if (outputEl) {
        outputEl.innerHTML = result.type === 'final'
          ? `<span style="font-weight:800;">${result.text}</span>`
          : `<em style="color:var(--text-muted);">${result.text}</em>`;
      }
    });

    // ── FPS (hidden) ──
    window.addEventListener('itda:fps:update', (e) => {
      const el = document.getElementById('fps-display');
      if (el) el.textContent = `FPS: ${e.detail.fps.toFixed(0)}`;
    });

    // ── Motion version ──
    window.ITDAMotion = window.ITDAMotion || { version: 'v2' };

    // ── STT badge ──
    function _updateSttBadge() { }
    if (window.ITDAStt) _updateSttBadge();

    // ── Emotion bar compat ──
    function updateEmotionBar() { }
  </script>

</body>
