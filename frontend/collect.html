<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>ITDA — 수어 데이터 수집기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    h1 { font-size: 1.6rem; color: #58a6ff; margin-bottom: 4px; }
    p.sub { color: #8b949e; font-size: 0.9rem; margin-bottom: 24px; }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 900px;
      margin-bottom: 20px;
    }
    .card h2 { font-size: 1rem; color: #58a6ff; margin-bottom: 12px; }

    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    input[type="text"] {
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #e6edf3;
      font-size: 1rem;
      flex: 1;
      min-width: 140px;
    }
    button {
      padding: 9px 20px;
      border-radius: 8px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-start  { background: #238636; color: #fff; }
    .btn-start:hover  { background: #2ea043; }
    .btn-stop   { background: #b62324; color: #fff; }
    .btn-stop:hover   { background: #da3633; }
    .btn-train  { background: #1f6feb; color: #fff; }
    .btn-train:hover  { background: #388bfd; }
    .btn-record { background: #6e40c9; color: #fff; font-size: 1rem; padding: 12px 28px; }
    .btn-record:hover { background: #8957e5; }
    .btn-record.recording { background: #da3633; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

    .status-box {
      background: #0d1117;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.9rem;
      color: #8b949e;
      min-height: 44px;
      margin-top: 12px;
    }
    .status-box span.count { color: #58a6ff; font-weight: 700; font-size: 1.1rem; }
    .status-box span.label { color: #3fb950; font-weight: 700; }
    .status-box span.ok   { color: #3fb950; }
    .status-box span.err  { color: #f85149; }

    .video-wrap {
      position: relative;
      width: 480px;
      height: 360px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #30363d;
      background: #000;
      margin: 0 auto;
    }
    video, canvas { position: absolute; top:0; left:0; width:100%; height:100%; object-fit: cover; }

    .word-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .chip {
      padding: 5px 14px;
      border-radius: 20px;
      background: #21262d;
      border: 1px solid #30363d;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .chip:hover { background: #1f6feb; border-color: #388bfd; }

    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th { text-align: left; color: #8b949e; padding: 6px 10px; border-bottom: 1px solid #30363d; }
    td { padding: 6px 10px; border-bottom: 1px solid #21262d; }
    td:first-child { color: #3fb950; font-weight: 600; }
  </style>
</head>
<body>
  <h1>🤲 수어 데이터 수집기</h1>
  <p class="sub">MediaPipe 손 관절 데이터를 수집하여 KNN 분류 모델을 훈련합니다.</p>

  <!-- 1. 카메라 + 녹화 -->
  <div class="card">
    <h2>📹 카메라 + 실시간 수집</h2>
    <div class="video-wrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>
    <div style="text-align:center; margin-top: 14px;">
      <button class="btn-record" id="recordBtn" disabled onclick="toggleRecord()">
        ⏺ 수집 시작
      </button>
    </div>
    <div class="status-box" id="recStatus">카메라 초기화 중...</div>
  </div>

  <!-- 2. 단어 설정 -->
  <div class="card">
    <h2>📝 수집할 단어 설정</h2>
    <div class="row">
      <input type="text" id="wordInput" placeholder="수집할 단어 입력 (예: 안녕하세요)" value="안녕하세요"/>
      <button class="btn-start" onclick="setWord()">단어 변경</button>
    </div>
    <div class="word-chips" id="wordChips"></div>
    <div class="status-box" id="wordStatus">단어를 선택하거나 입력하세요.</div>
  </div>

  <!-- 3. 모델 훈련 -->
  <div class="card">
    <h2>🤖 KNN 모델 훈련</h2>
    <div class="row">
      <button class="btn-train" onclick="trainModel()">🚀 모델 훈련 시작</button>
      <button class="btn-train" style="background:#388bfd" onclick="checkModel()">🔍 모델 상태 확인</button>
    </div>
    <div class="status-box" id="trainStatus">수집된 데이터로 KNN 모델을 훈련합니다.</div>
  </div>

  <!-- 4. 수집 현황 -->
  <div class="card">
    <h2>📊 수집 현황</h2>
    <table>
      <thead><tr><th>단어</th><th>샘플 수</th></tr></thead>
      <tbody id="statsTable"><tr><td colspan="2" style="color:#8b949e">—</td></tr></tbody>
    </table>
  </div>

  <script type="module">
    const API = 'http://localhost:8000/api/collect';
    const SAMPLE_INTERVAL_MS = 100; // 0.1초마다 1프레임 수집
    const TARGET_SAMPLES = 100;     // 단어당 목표 샘플 수

    const PRESET_WORDS = ['안녕하세요','고맙습니다','미안합니다','사랑합니다','힘내세요','괜찮아요','어디에요','이름이 뭐예요'];

    let isRecording = false;
    let collectInterval = null;
    let currentWord = '안녕하세요';
    let currentCount = 0;

    // ── MediaPipe 손 감지 ────────────────────────────────────
    const { HandLandmarker, FilesetResolver } = await import(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs'
    );
    const vision = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
    );
    const handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: { 
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', 
        delegate: 'GPU' 
      },
      runningMode: 'VIDEO', 
      numHands: 2,
      minHandDetectionConfidence: 0.3,
      minHandPresenceConfidence: 0.3,
      minTrackingConfidence: 0.3
    });

    // ── 카메라 시작 ──────────────────────────────────────────
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    let latestLandmarks = null;

    navigator.mediaDevices.getUserMedia({ video: { width: 480, height: 360 }, audio: false })
      .then(stream => {
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          overlay.width = video.videoWidth;
          overlay.height = video.videoHeight;
          document.getElementById('recordBtn').disabled = false;
          document.getElementById('recStatus').innerHTML = '카메라 준비 완료! 단어를 선택하고 수집 시작 버튼을 누르세요.';
          requestAnimationFrame(detectLoop);
        };
      });

    let lastVideoTime = -1;
    async function detectLoop(ts) {
      requestAnimationFrame(detectLoop);
      if (video.readyState < 2) return;
      if (video.currentTime === lastVideoTime) return;
      lastVideoTime = video.currentTime;
      const result = handLandmarker.detectForVideo(video, ts);
      latestLandmarks = result.landmarks?.[0] ?? null;

      ctx.clearRect(0, 0, overlay.width, overlay.height);
      if (latestLandmarks) {
        drawHand(latestLandmarks);
      }
    }

    function drawHand(lms) {
      const W = overlay.width, H = overlay.height;
      const CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
      ctx.strokeStyle = isRecording ? '#f85149' : '#58a6ff';
      ctx.lineWidth = 2;
      for (const [a, b] of CONNECTIONS) {
        ctx.beginPath();
        ctx.moveTo(lms[a].x * W, lms[a].y * H);
        ctx.lineTo(lms[b].x * W, lms[b].y * H);
        ctx.stroke();
      }
      ctx.fillStyle = isRecording ? '#f85149' : '#58a6ff';
      for (const lm of lms) {
        ctx.beginPath();
        ctx.arc(lm.x * W, lm.y * H, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // ── 단어 칩 생성 ────────────────────────────────────────
    const chipsEl = document.getElementById('wordChips');
    for (const w of PRESET_WORDS) {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = w;
      chip.onclick = () => { document.getElementById('wordInput').value = w; setWord(); };
      chipsEl.appendChild(chip);
    }

    // ── 전역 함수 ────────────────────────────────────────────
    window.setWord = async () => {
      const word = document.getElementById('wordInput').value.trim();
      if (!word) return;
      currentWord = word;
      const res = await fetch(`${API}/start`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ label: word }) });
      const data = await res.json();
      currentCount = 0;
      document.getElementById('wordStatus').innerHTML = `✅ 현재 수집 단어: <span style="color:#3fb950;font-weight:700">${word}</span>`;
      await refreshStatus();
    };

    window.toggleRecord = () => {
      if (isRecording) {
        stopRecord();
      } else {
        startRecord();
      }
    };

    function startRecord() {
      if (!latestLandmarks) {
        alert('손이 카메라에 잡히지 않습니다! 손을 카메라 앞에 가져오세요.');
        return;
      }
      isRecording = true;
      document.getElementById('recordBtn').textContent = '⏹ 수집 중지';
      document.getElementById('recordBtn').className = 'btn-record recording';
      collectInterval = setInterval(sendSample, SAMPLE_INTERVAL_MS);
    }

    function stopRecord() {
      isRecording = false;
      clearInterval(collectInterval);
      document.getElementById('recordBtn').textContent = '⏺ 수집 시작';
      document.getElementById('recordBtn').className = 'btn-record';
      refreshStatus();
    }

    async function sendSample() {
      if (!latestLandmarks) return;
      const lms = latestLandmarks.map(lm => ({ x: lm.x, y: lm.y, z: lm.z ?? 0 }));
      const res = await fetch(`${API}/sample`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ landmarks: lms, handedness: 'Right' }),
      });
      const data = await res.json();
      if (data.ok) {
        currentCount = data.count;
        const pct = Math.min(100, Math.round(currentCount / TARGET_SAMPLES * 100));
        document.getElementById('recStatus').innerHTML =
          `🔴 수집 중 — <span class="label">${currentWord}</span>: <span class="count">${currentCount}</span>개 저장됨 (목표 ${TARGET_SAMPLES}개, ${pct}%)`;
        if (currentCount >= TARGET_SAMPLES) {
          stopRecord();
          document.getElementById('recStatus').innerHTML =
            `✅ 목표 달성! <span class="label">${currentWord}</span> ${currentCount}개 수집 완료. 다음 단어를 선택하세요.`;
        }
      }
    }

    window.trainModel = async () => {
      document.getElementById('trainStatus').innerHTML = '⏳ KNN 모델 훈련 중...';
      const res = await fetch(`${API}/train`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ n_neighbors: 5 }) });
      const data = await res.json();
      if (data.ok) {
        document.getElementById('trainStatus').innerHTML =
          `<span class="ok">✅ 훈련 완료!</span> ${data.label_count}개 단어 / ${data.samples}개 샘플 / 정확도: <strong>${data.accuracy}%</strong><br>인식 단어: ${data.labels.join(', ')}`;
      } else {
        document.getElementById('trainStatus').innerHTML = `<span class="err">❌ ${data.message}</span>`;
      }
    };

    window.checkModel = async () => {
      const res = await fetch(`${API}/predict-test`);
      const data = await res.json();
      if (data.ok) {
        document.getElementById('trainStatus').innerHTML =
          `<span class="ok">✅ 모델 로드됨</span> — 인식 가능 단어: ${data.labels.join(', ')}`;
      } else {
        document.getElementById('trainStatus').innerHTML = `<span class="err">❌ ${data.message}</span>`;
      }
    };

    async function refreshStatus() {
      const res = await fetch(`${API}/status`);
      const data = await res.json();
      document.getElementById('statsTable').innerHTML = data.count > 0
        ? `<tr><td>${data.label}</td><td>${data.count}개</td></tr>`
        : `<tr><td colspan="2" style="color:#8b949e">수집된 데이터가 없습니다.</td></tr>`;
    }

    // 초기화
    await setWord();
  </script>
</body>
</html>
