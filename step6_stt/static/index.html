<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>잇다(ITDA) — 6단계: 실시간 수어 통역</title>
  <meta name="description" content="시스템 사운드 캡처 → Whisper STT → RAG 수어 검색 → PIP 오버레이" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    /* ── 리셋 & 변수 ──────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:    #060A18;
      --bg-card:    #0F172A;
      --bg-glass:   rgba(15, 23, 42, 0.75);
      --border:     rgba(255, 255, 255, 0.08);
      --accent:     #00FFB3;
      --accent2:    #7C3AED;
      --accent3:    #FF6B6B;
      --accent4:    #FBBF24;
      --text-main:  #F1F5F9;
      --text-muted: #94A3B8;
      --radius-lg:  16px;
      --radius-md:  10px;
      --shadow-lg:  0 25px 50px rgba(0,0,0,0.6);
    }

    html, body { height: 100%; font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg-deep); color: var(--text-main); overflow: hidden; }

    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 55% 40% at 15% 25%, rgba(0,255,179,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 50% 55% at 85% 75%, rgba(124,58,237,0.09) 0%, transparent 60%);
    }

    /* ── 전체 레이아웃 ────────────────────────────────────── */
    .app {
      position: relative; z-index: 1;
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
    }

    /* ── 헤더 ─────────────────────────────────────────────── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 24px;
      background: var(--bg-glass); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .logo-text { font-size: 1.05rem; font-weight: 700; }
    .logo-sub  { font-size: 0.72rem; color: var(--text-muted); margin-top: 1px; }
    .header-badges { display: flex; gap: 8px; align-items: center; }
    .badge {
      padding: 3px 10px; border-radius: 20px;
      font-size: 0.70rem; font-weight: 600; letter-spacing: 0.04em;
    }
    .badge-step   { background: rgba(124,58,237,0.2); color: #A78BFA; border: 1px solid rgba(124,58,237,0.3); }
    .badge-ws     { background: rgba(0,255,179,0.1); color: var(--accent); border: 1px solid rgba(0,255,179,0.25); }
    .badge-ws.off { background: rgba(255,107,107,0.1); color: var(--accent3); border-color: rgba(255,107,107,0.25); }

    /* ── 메인 2-칼럼 ─────────────────────────────────────── */
    main {
      display: grid;
      grid-template-columns: 1fr 380px;
      overflow: hidden;
    }

    /* ── 좌측: 컨트롤 + 자막 영역 ───────────────────────── */
    .left-panel {
      display: flex; flex-direction: column; gap: 0;
      overflow-y: auto; padding: 20px; gap: 16px;
    }

    .section {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
    }
    .section-title {
      font-size: 0.70rem; font-weight: 700; letter-spacing: 0.09em;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px;
    }

    /* 소스 선택 */
    .source-tabs { display: flex; gap: 8px; }
    .source-tab {
      flex: 1; padding: 10px; border-radius: var(--radius-md);
      border: 1px solid var(--border); background: transparent;
      color: var(--text-muted); font-family: inherit; font-size: 0.88rem;
      cursor: pointer; transition: all 0.2s; text-align: center;
    }
    .source-tab:hover { border-color: var(--accent); color: var(--accent); }
    .source-tab.active {
      background: rgba(0,255,179,0.12); border-color: var(--accent);
      color: var(--accent); font-weight: 600;
    }

    /* 버튼 */
    .btn {
      width: 100%; padding: 11px; border: none; border-radius: var(--radius-md);
      font-family: inherit; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 7px;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-start {
      background: linear-gradient(135deg, var(--accent), #00CFA8);
      color: #060A18;
    }
    .btn-start:hover:not(:disabled) { filter: brightness(1.1); box-shadow: 0 0 18px rgba(0,255,179,0.3); }
    .btn-stop {
      background: rgba(255,107,107,0.15); color: var(--accent3);
      border: 1px solid rgba(255,107,107,0.3);
    }
    .btn-stop:hover:not(:disabled) { background: rgba(255,107,107,0.25); }
    .btn-row { display: flex; gap: 8px; }
    .btn-row .btn { flex: 1; }

    /* 통계 그리드 */
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat-item {
      background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      border-radius: 8px; padding: 9px 12px;
    }
    .stat-label { font-size: 0.65rem; color: var(--text-muted); margin-bottom: 3px; }
    .stat-value {
      font-family: 'JetBrains Mono', monospace; font-size: 1.05rem;
      font-weight: 700; color: var(--accent);
    }

    /* 자막 히스토리 */
    .transcript-box {
      background: #040810; border: 1px solid var(--border); border-radius: 8px;
      padding: 12px; min-height: 140px; max-height: 200px; overflow-y: auto;
      font-size: 0.85rem; line-height: 1.7;
    }
    .transcript-line { margin-bottom: 4px; }
    .transcript-line.latest { color: #fff; }
    .transcript-line.old    { color: var(--text-muted); }
    .transcript-empty { color: var(--text-muted); font-style: italic; font-size: 0.82rem; }
    .conf-badge {
      display: inline-block; margin-left: 6px; padding: 1px 6px;
      background: rgba(0,255,179,0.1); border-radius: 10px;
      font-size: 0.65rem; color: var(--accent);
    }

    /* 안내 */
    .guide-box {
      background: rgba(251,191,36,0.07); border: 1px solid rgba(251,191,36,0.2);
      border-radius: var(--radius-md); padding: 14px;
      font-size: 0.80rem; color: #FCD34D; line-height: 1.7;
    }
    .guide-box strong { color: var(--accent4); }

    /* ── 우측: PIP 패널 ──────────────────────────────────── */
    .right-panel {
      border-left: 1px solid var(--border);
      background: var(--bg-card);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* PIP 루트 */
    #pip-root {
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* 아바타 존 */
    .pip-avatar {
      flex: 0 0 200px;
      background: linear-gradient(180deg, #0A0F20 0%, #070C1A 100%);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
    }
    .pip-avatar-placeholder {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .avatar-icon { font-size: 48px; opacity: 0.6; }
    .avatar-hint { font-size: 0.72rem; color: var(--text-muted); text-align: center; }

    /* 자막 */
    .pip-captions {
      padding: 12px 14px; border-bottom: 1px solid var(--border);
    }
    .caption-label, .signs-label {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px;
    }
    .caption-lines { min-height: 48px; }
    .caption-line {
      font-size: 0.88rem; line-height: 1.6; margin-bottom: 3px;
      display: flex; align-items: baseline; gap: 6px;
    }
    .caption-line.latest { font-weight: 600; color: var(--text-main); }
    .caption-text { flex: 1; }
    .caption-conf { font-size: 0.65rem; color: var(--text-muted); flex-shrink: 0; }
    .caption-empty { color: var(--text-muted); font-style: italic; font-size: 0.80rem; }

    /* 수어 카드 */
    .pip-signs {
      flex: 1; padding: 12px 14px; overflow-y: auto;
    }
    .signs-list { display: flex; flex-direction: column; gap: 8px; }
    .signs-empty { color: var(--text-muted); font-style: italic; font-size: 0.80rem; }

    .emotion-bar-wrap {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    }
    .emotion-label { font-size: 0.68rem; color: var(--text-muted); white-space: nowrap; }
    .emotion-bar {
      flex: 1; height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px;
      overflow: hidden;
    }
    .emotion-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      border-radius: 3px; transition: width 0.4s ease;
    }
    .emotion-val { font-family: 'JetBrains Mono', monospace; font-size: 0.70rem; color: var(--accent); }

    .sign-card {
      background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px;
      transition: border-color 0.2s;
    }
    .sign-card:hover { border-color: rgba(0,255,179,0.3); }
    .sign-word { font-size: 1.0rem; font-weight: 700; color: var(--accent); margin-bottom: 3px; }
    .sign-emotion {
      display: inline-block; padding: 1px 8px; border-radius: 10px;
      font-size: 0.65rem; font-weight: 600;
      background: rgba(124,58,237,0.2); color: #A78BFA;
      border: 1px solid rgba(124,58,237,0.3); margin-bottom: 5px;
    }
    .sign-desc { font-size: 0.76rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 6px; }
    .sign-conf-bar {
      height: 3px; background: rgba(255,255,255,0.07); border-radius: 2px; overflow: hidden;
    }
    .sign-conf-fill {
      height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s ease;
    }

    /* 상태 바 */
    .pip-status-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px; border-top: 1px solid var(--border);
      font-size: 0.72rem; color: var(--text-muted);
      background: var(--bg-glass); backdrop-filter: blur(10px);
    }
    .pip-latency { margin-left: auto; font-family: 'JetBrains Mono', monospace; color: var(--accent); }

    /* 상태 점 */
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }
    .status-dot.on  { background: var(--accent); animation: blink 1.5s ease-in-out infinite; }
    .status-dot.off { background: #374151; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

    /* ── 푸터 ─────────────────────────────────────────────── */
    footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 24px;
      background: var(--bg-glass); backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      font-size: 0.70rem; color: var(--text-muted);
    }
    .footer-left { display: flex; align-items: center; gap: 14px; }

    /* 스크롤바 */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* 반응형 */
    @media (max-width: 720px) {
      main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      .right-panel { border-left: none; border-top: 1px solid var(--border); max-height: 300px; }
      .pip-avatar { flex: 0 0 80px; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- ── 헤더 ──────────────────────────────────────────────── -->
  <header>
    <div class="logo">
      <div class="logo-icon">🎧</div>
      <div>
        <div class="logo-text">잇다<span style="color:var(--text-muted);font-weight:300"> ITDA</span></div>
        <div class="logo-sub">6단계 · 실시간 수어 통역 레이어 (STT + RAG)</div>
      </div>
    </div>
    <div class="header-badges">
      <span class="badge badge-step">STEP 6</span>
      <span class="badge badge-ws off" id="ws-badge">WS 미연결</span>
    </div>
  </header>

  <!-- ── 메인 ──────────────────────────────────────────────── -->
  <main>

    <!-- 좌측 컨트롤 패널 -->
    <div class="left-panel">

      <!-- 오디오 소스 선택 -->
      <div class="section">
        <div class="section-title">🎚 오디오 소스</div>
        <div class="source-tabs">
          <button class="source-tab active" id="tab-system" onclick="selectSource('system')">
            🖥 시스템 오디오<br/><small style="font-weight:400;font-size:0.70rem">유튜브·앱 소리</small>
          </button>
          <button class="source-tab" id="tab-mic" onclick="selectSource('mic')">
            🎤 마이크<br/><small style="font-weight:400;font-size:0.70rem">내 목소리</small>
          </button>
        </div>
      </div>

      <!-- 제어 버튼 -->
      <div class="section">
        <div class="section-title">▶ 제어</div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <button class="btn btn-start" id="btn-start">
            <span>▶</span> 수어 통역 시작
          </button>
          <button class="btn btn-stop" id="btn-stop" disabled>
            <span>⏹</span> 중지
          </button>
          <div class="btn-row">
            <button class="btn" id="btn-pip-toggle"
                    style="background:rgba(124,58,237,0.15);color:#A78BFA;border:1px solid rgba(124,58,237,0.3);">
              📺 PIP 토글
            </button>
            <button class="btn" id="btn-clear"
                    style="background:rgba(255,255,255,0.05);color:var(--text-muted);border:1px solid var(--border);">
              🗑 초기화
            </button>
          </div>
        </div>
      </div>

      <!-- 실시간 통계 -->
      <div class="section">
        <div class="section-title">📊 실시간 통계</div>
        <div class="stat-grid">
          <div class="stat-item">
            <div class="stat-label">처리 청크</div>
            <div class="stat-value" id="stat-chunks">0</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">수어 단어</div>
            <div class="stat-value" id="stat-signs">0</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">처리 속도</div>
            <div class="stat-value" id="stat-ms">—</div>
          </div>
        </div>
      </div>

      <!-- 자막 히스토리 -->
      <div class="section" style="flex:1;">
        <div class="section-title">📝 인식 텍스트 히스토리</div>
        <div class="transcript-box" id="transcript-box">
          <div class="transcript-empty">캡처를 시작하면 인식된 텍스트가 쌓입니다...</div>
        </div>
      </div>

      <!-- 사용 안내 -->
      <div class="guide-box">
        <strong>시스템 오디오 캡처 방법</strong><br/>
        ① "수어 통역 시작" 클릭<br/>
        ② 브라우저 화면 공유 팝업에서 <strong>탭 선택 → "탭 오디오 공유" 체크</strong><br/>
        ③ 유튜브·영상 재생 시 자동으로 자막 + 수어 번역이 시작됩니다
      </div>

    </div>

    <!-- 우측 패널 (PIP) -->
    <div class="right-panel">
      <div id="pip-root" style="flex:1;display:flex;flex-direction:column;overflow:hidden;"></div>
    </div>

  </main>

  <!-- ── 푸터 ──────────────────────────────────────────────── -->
  <footer>
    <div class="footer-left">
      <div class="status-dot off" id="footer-dot"></div>
      <span id="footer-status">대기 중 — 소스를 선택하고 시작하세요</span>
    </div>
    <div>잇다(ITDA) · 6단계 · 세션 <span id="session-display" style="font-family:monospace;">—</span></div>
  </footer>

</div>

<!-- ── 스크립트 ─────────────────────────────────────────────── -->
<script src="./js/audio_capture.js"></script>
<script src="./js/stt_client.js"></script>
<script src="./js/pip_overlay.js"></script>

<script>
// ══════════════════════════════════════════════════════════════
//  ITDA 6단계 — 메인 진입점
//  AudioCapture → STTClient → PIPOverlay 연결
// ══════════════════════════════════════════════════════════════

// ── 서버 URL (같은 서버에서 서빙되므로 location.host 사용) ──
const WS_URL = `ws://${location.host}/api/ws/stt`;

// ── 인스턴스 생성 ─────────────────────────────────────────────
const overlay = new PIPOverlay({ container: document.getElementById('pip-root') });
const client  = new STTClient({ wsUrl: WS_URL });

const capture = new AudioCapture({
  chunkMs:   2000,
  onChunk:   (blob, meta) => client.sendChunk(blob, meta),
  onStateChange: (state) => {
    if (state === 'capturing') setFooterStatus('🔴 캡처 중 — 수어 통역 중', true);
    if (state === 'idle')      setFooterStatus('⏹ 중지됨', false);
    if (state === 'error')     setFooterStatus('❌ 캡처 오류 — 권한을 확인해 주세요', false);
  },
});

// ── UI 요소 ───────────────────────────────────────────────────
const btnStart     = document.getElementById('btn-start');
const btnStop      = document.getElementById('btn-stop');
const btnPipToggle = document.getElementById('btn-pip-toggle');
const btnClear     = document.getElementById('btn-clear');
const wsBadge      = document.getElementById('ws-badge');
const footerDot    = document.getElementById('footer-dot');
const footerStatus = document.getElementById('footer-status');
const transcriptBox= document.getElementById('transcript-box');
const sessionDisp  = document.getElementById('session-display');
const statChunks   = document.getElementById('stat-chunks');
const statSigns    = document.getElementById('stat-signs');
const statMs       = document.getElementById('stat-ms');

let selectedSource  = 'system';
let totalChunks     = 0;
let totalSigns      = 0;
let transcriptLines = [];

// ── 세션 ID 표시 ─────────────────────────────────────────────
sessionDisp.textContent = client.sessionId;

// ── 소스 선택 ────────────────────────────────────────────────
function selectSource(src) {
  selectedSource = src;
  document.getElementById('tab-system').classList.toggle('active', src === 'system');
  document.getElementById('tab-mic').classList.toggle('active', src === 'mic');
}

// ── 시작 ─────────────────────────────────────────────────────
btnStart.addEventListener('click', async () => {
  try {
    btnStart.disabled = true;
    btnStart.innerHTML = '<span>⏳</span> 연결 중...';

    client.connect();
    await capture.start(selectedSource);

    btnStop.disabled  = false;
    btnStart.innerHTML = '<span>▶</span> 수어 통역 시작';
    setFooterStatus('🔴 캡처 중', true);
  } catch (err) {
    console.error(err);
    btnStart.disabled = false;
    btnStart.innerHTML = '<span>▶</span> 수어 통역 시작';
    alert('캡처 시작 실패:\n' + err.message);
  }
});

// ── 중지 ─────────────────────────────────────────────────────
btnStop.addEventListener('click', () => {
  capture.stop();
  client.disconnect();
  btnStop.disabled  = true;
  btnStart.disabled = false;
  setFooterStatus('⏹ 중지됨', false);
});

// ── PIP 토글 ─────────────────────────────────────────────────
btnPipToggle.addEventListener('click', () => overlay.toggle());

// ── 초기화 ───────────────────────────────────────────────────
btnClear.addEventListener('click', () => {
  transcriptLines = [];
  totalChunks = 0; totalSigns = 0;
  renderTranscript();
  statChunks.textContent = '0';
  statSigns.textContent  = '0';
  statMs.textContent     = '—';
});

// ── WS 상태 배지 ──────────────────────────────────────────────
window.addEventListener('itda:ws:open',  () => {
  wsBadge.textContent = 'WS 연결됨';
  wsBadge.classList.remove('off');
});
window.addEventListener('itda:ws:close', () => {
  wsBadge.textContent = 'WS 미연결';
  wsBadge.classList.add('off');
});

// ── STT 텍스트 수신 ──────────────────────────────────────────
window.addEventListener('itda:stt:text', (e) => {
  const { text, confidence, process_ms } = e.detail;
  if (!text) return;

  totalChunks++;
  statChunks.textContent = totalChunks;
  statMs.textContent = Math.round(process_ms) + 'ms';

  // 히스토리 추가 (최근 20줄 유지)
  transcriptLines.push({ text, confidence });
  if (transcriptLines.length > 20) transcriptLines.shift();
  renderTranscript();
});

// ── 수어 검색 결과 수신 ──────────────────────────────────────
window.addEventListener('itda:stt:sign', (e) => {
  const { sign_terms } = e.detail;
  totalSigns += (sign_terms || []).length;
  statSigns.textContent = totalSigns;
});

// ── 오류 ─────────────────────────────────────────────────────
window.addEventListener('itda:stt:error', (e) => {
  console.error('[STT Error]', e.detail.error_msg);
  setFooterStatus('⚠ STT 오류: ' + (e.detail.error_msg || ''), false);
});

// ── 자막 히스토리 렌더링 ─────────────────────────────────────
function renderTranscript() {
  if (!transcriptLines.length) {
    transcriptBox.innerHTML = '<div class="transcript-empty">캡처를 시작하면 인식된 텍스트가 쌓입니다...</div>';
    return;
  }
  const html = transcriptLines.map((l, i) => {
    const isLatest = i === transcriptLines.length - 1;
    const conf     = Math.round((l.confidence || 1) * 100);
    return `<div class="transcript-line ${isLatest ? 'latest' : 'old'}">
      ${escHtml(l.text)}<span class="conf-badge">${conf}%</span>
    </div>`;
  }).join('');
  transcriptBox.innerHTML = html;
  transcriptBox.scrollTop = transcriptBox.scrollHeight;
}

// ── 푸터 상태 ────────────────────────────────────────────────
function setFooterStatus(msg, active) {
  footerStatus.textContent = msg;
  footerDot.className = 'status-dot ' + (active ? 'on' : 'off');
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
